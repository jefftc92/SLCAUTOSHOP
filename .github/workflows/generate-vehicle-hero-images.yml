name: Generate Vehicle Hero Images

on:
  workflow_dispatch:
  push:
    branches:
      - claude/honda-models-full-content
      - claude/lighten-model-heroes
    paths:
      - 'scripts/generate_vehicle_hero_images.py'
      - '.github/workflows/generate-vehicle-hero-images.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow requests numpy

      - name: Delete existing fallback images
        run: rm -f artifacts/slcautoshop/public/images/models/*.webp

      - name: Generate images via ModelsLab
        env:
          MODELSLAB_API_KEY: ${{ secrets.MODELSLAB_API_KEY }}
        run: python3 scripts/generate_vehicle_hero_images.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/slcautoshop/public/images/models/
          if git diff --staged --quiet; then
            echo "No image changes to commit"
          else
            git commit -m "Generate vehicle hero images via ModelsLab"
            git push
          fi
