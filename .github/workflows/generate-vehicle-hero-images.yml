name: Generate Vehicle Hero Images

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow requests numpy

      - name: Delete existing fallback images
        run: rm -f artifacts/slcautoshop/public/images/models/*.webp

      - name: Generate images from Wikipedia
        run: python3 scripts/generate_vehicle_hero_images.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/slcautoshop/public/images/models/
          if git diff --staged --quiet; then
            echo "No image changes to commit"
          else
            git commit -m "Generate vehicle hero images from Wikipedia"
            git push
          fi
